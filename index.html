<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#0a111e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>المباحث</title>
<style>
:root{--bg:#0d1523;--bg2:#16233a;--card:#1a2840;--line:#2b3d58;--gold:#d9b44a;--paper:#e9dcb8;--ink:#2a2418;--red:#c0392b;--ok:#3fa56b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#f1ead6;font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55}
button{font-family:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.scr{height:100%;overflow:auto;padding:14px;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:44px;margin:6px 0;font-weight:900;color:var(--gold);text-align:center;letter-spacing:0}
h2,h3{margin:10px 0 6px}
.m{color:#a9a48f}
.btn{display:block;width:100%;border:0;border-radius:6px;background:var(--gold);color:#241c06;font-weight:700;font-size:16px;padding:10px 12px;margin:8px 0;cursor:pointer;box-shadow:0 3px 0 #8a6d1c}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #6e1712}
.btn.sm{display:inline-block;width:auto;padding:5px 12px;font-size:13px;margin:3px}
.btn.ghost{background:#24354f;color:#f1ead6;box-shadow:0 3px 0 #111a2a}
.btn:disabled{opacity:.45}
input.t{width:100%;padding:10px;border-radius:6px;border:2px solid var(--line);background:#fff8e4;color:var(--ink);font:700 16px Tahoma,sans-serif;margin:5px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.code{font-size:44px;font-weight:900;letter-spacing:6px;text-align:center;color:var(--gold);direction:ltr}
.pl{display:inline-block;background:#0a111e;border:1px solid var(--line);border-radius:20px;padding:0 10px;margin:3px;font-size:13px}.pl.off{opacity:.45}
.rolec{display:flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:#142036}
.rolec.mine{border-color:var(--gold);background:#2a2412}.rolec.taken{opacity:.55}
.rolec .ic{font-size:26px}
/* play */
.hd{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:#0a111e;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.hd .sp{flex:1;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:#16233a;color:#f1ead6;border-radius:6px;padding:3px 9px;font-size:14px;cursor:pointer;height:30px}
.ib.on{background:#2e7d32}.ib.rd{background:#8c2a20}
.bd{flex:1;min-height:0;display:flex}
.mn{flex:1;min-width:0;display:flex;flex-direction:column}
.tc{flex:1;min-height:0;overflow:auto;position:relative;background:#070c14}
.tabs{height:44px;flex:none;display:flex;background:#0a111e;border-top:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:#a9a48f;font-weight:700;font-size:13px;cursor:pointer;border-top:3px solid transparent;padding:0 2px}
.tab.on{color:var(--gold);border-top-color:var(--gold);background:#121d30}
.tab .bg{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-inline-start:3px}
.chp{width:215px;flex:none;display:flex;flex-direction:column;border-inline-start:1px solid var(--line);background:#0a111e}
.chp h4{margin:0;padding:6px 10px;font-size:13px;background:#101b2e;border-bottom:1px solid var(--line)}
.chl{flex:1;overflow:auto;padding:6px 8px;font-size:12px}
.chl div{margin:3px 0;word-break:break-word}
.chl .sys{color:var(--gold);font-size:12px}
.rl{color:#7fc4ff;font-size:11px}
.cin{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
.cin input{flex:1;min-width:0;padding:7px;border-radius:6px;border:1px solid var(--line);background:#fff8e4;color:var(--ink);font:600 14px Tahoma,sans-serif}
.cin button{border:0;border-radius:6px;background:var(--gold);color:#241c06;font-weight:700;padding:0 12px}
.pbar{display:flex;flex-wrap:wrap;gap:3px;padding:5px 8px;border-bottom:1px solid var(--line)}
.rot{background:#3b2f10;color:#ffe9a8;text-align:center;font-size:12px;padding:3px;flex:none;display:none}
@media (orientation:portrait){.rot{display:block}}
@media (orientation:portrait),(max-width:640px){.chp{position:fixed;top:40px;bottom:44px;inset-inline-end:0;width:min(86vw,320px);z-index:30;display:none;box-shadow:-4px 0 14px #000a}.chp.open{display:flex}}
@media (min-width:641px) and (orientation:landscape){.chtog{display:none}}
/* scene */
.scw{height:100%;display:flex;align-items:center;justify-content:center;background:#000}
.sc{position:relative;height:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden}
@media (orientation:portrait){.sc{height:auto;width:100%}.scw{align-items:flex-start;padding-top:6px}}
.sc img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:2px solid #ffd966;background:rgba(255,217,102,.12);animation:pl 1.8s infinite;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 0 4px #000}
.hs.done{border-color:var(--ok);background:rgba(63,165,107,.25);animation:none}
.hs.lock{border-color:#888;border-style:dashed;background:rgba(0,0,0,.35);animation:none}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,217,102,.55)}50%{box-shadow:0 0 0 7px rgba(255,217,102,0)}}
.sch{position:absolute;top:6px;inset-inline-start:6px;background:#000b;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px}
.scf{position:absolute;bottom:6px;inset-inline:6px;background:#000c;border:1px solid var(--gold);border-radius:6px;padding:6px 10px;font-size:13px;display:none}
/* panels */
.pn{padding:10px;max-width:900px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:230px}
.tool{display:inline-block;border:2px solid var(--line);background:#16233a;color:#f1ead6;border-radius:8px;padding:6px 10px;margin:3px;cursor:pointer;font-size:14px}
.tool.on{border-color:var(--gold);background:#2a2412}
.reg{fill:rgba(255,217,102,.0);stroke:#ffd966;stroke-dasharray:3 3;cursor:pointer}
.reg:hover,.reg:active{fill:rgba(255,217,102,.25)}
.fnd{background:#e9dcb8;color:#2a2418;border-radius:4px;padding:6px 8px;margin:5px 0;border-inline-start:5px solid var(--gold);font-size:13px}
.fnd b{display:block}
.pr{display:inline-block;background:#f4ecd4;border:3px solid #2a2418;border-radius:6px;padding:3px;margin:4px;cursor:pointer;text-align:center;color:#2a2418;font-size:12px;font-weight:700}
.pr.on{border-color:var(--red);box-shadow:0 0 0 3px #c0392b66}
.pr svg{width:92px;height:92px;display:block;background:#f4ecd4}
.big svg{width:150px;height:150px}
/* board */
.bdw{display:flex;height:100%}
.tray{width:150px;flex:none;overflow:auto;background:#0f1a2c;border-inline-end:1px solid var(--line);padding:6px}
.tray .it{display:flex;gap:4px;align-items:center;background:#e9dcb8;color:#2a2418;border-radius:4px;padding:4px 6px;margin:4px 0;font-size:12px;border-inline-start:4px solid var(--gold)}
.tray .it span{flex:1}
.tray .it button{border:0;background:var(--gold);border-radius:4px;font-size:12px;padding:2px 6px}
.tray .it.sus{border-inline-start-color:#7fc4ff}.tray .it.body{border-inline-start-color:#c26be0}.tray .it.print{border-inline-start-color:#ff8c5a}.tray .it.testimony{border-inline-start-color:#e05a5a}
.cork{position:relative;flex:1;background:#3a2a1a center/cover no-repeat;overflow:hidden;touch-action:none}
.cork svg.th{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.pin{position:absolute;width:15%;min-width:74px;font-size:10px;background:#f1e6c4;color:#2a2418;border-radius:3px;padding:5px 6px 4px;font-size:11px;font-weight:700;line-height:1.3;box-shadow:2px 4px 8px #0008;cursor:grab;user-select:none;touch-action:none;border-top:5px solid #c0392b}
.pin.sus{background:#fff;padding:4px;border-top-color:#2c6e91;text-align:center}
.pin.sus img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;border:1px solid #999}
.pin.sel{outline:3px solid #52c8ff}
.pin .x{position:absolute;top:-8px;inset-inline-start:-8px;background:#222;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:11px;line-height:18px;cursor:pointer}
/* suspects */
.sg{display:flex;gap:6px;padding:8px 8px 0}
.sc2{flex:1;display:flex;gap:6px;align-items:center;background:#16233a;border:2px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;min-width:0}
.sc2.on{border-color:var(--gold)}
.sc2.gone{opacity:.4}
.sc2 img{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:4px}
.mood{height:6px;border-radius:3px;background:#243553;overflow:hidden;margin-top:3px}.mood i{display:block;height:100%;background:linear-gradient(90deg,#3fa56b,#e0b43a,#c0392b)}
.iv{display:flex;gap:10px;padding:8px;height:calc(100% - 66px)}
.ivp{width:150px;flex:none;text-align:center}
.ivp img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:8px;border:2px solid var(--gold)}
.ivl{flex:1;display:flex;flex-direction:column;min-width:0}
.log{flex:1;overflow:auto;background:#0a111e;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.q{margin:5px 0;color:#9ec9ff}.q b{color:#7fc4ff;font-size:12px}
.a{margin:5px 0;background:#2b2412;border-inline-start:4px solid var(--gold);padding:5px 8px;border-radius:4px}
.a.crack{background:#3a1713;border-color:var(--red);font-weight:700}
@media (orientation:portrait){.iv{flex-direction:column}.ivp{width:100%;display:flex;gap:8px;text-align:start;align-items:center}.ivp img{width:70px}}
.res{max-width:560px;margin:0 auto;text-align:center}
.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);padding:2px 18px;font-weight:900;font-size:26px;transform:rotate(-5deg);border-radius:6px;margin:8px}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
#toast{position:fixed;top:48px;left:10px;right:10px;z-index:99;background:#b3261e;color:#fff;padding:9px 14px;border-radius:6px;font-weight:700;text-align:center;display:none}
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:12px;max-width:520px;width:100%;max-height:90%;overflow:auto}
</style></head><body><div id="app"></div><div id="toast"></div><script src="/game.js"></script></body></html>

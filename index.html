<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اعرف مين المعايا؟</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#FFF4D6;--ink:#2b2140;--y:#FFC93C;--p:#FF6B9D;--t:#2EC4B6;--v:#7B5CFF;--r:#FF5A5F;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:700;overflow:hidden}
body{background-image:radial-gradient(#ffe29a 2px,transparent 2px);background-size:22px 22px}
#app{height:100%;display:flex;flex-direction:column}
button{font-family:inherit;font-weight:900;color:var(--ink);cursor:pointer}
.btn,.ib,.chip,.cat,.tabs button,.emos button{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:7px 14px;font-size:15px;transition:transform .08s}
.btn:active,.ib:active,.chip:active,.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--y)}.btn.t{background:var(--t)}.btn.p{background:var(--p)}.btn.r{background:var(--r);color:#fff}.btn.sm{padding:6px 10px;font-size:14px}.big2{width:100%;margin-top:10px;font-size:20px;padding:10px}
.ib{padding:3px 9px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}.ib.rd{background:var(--r);color:#fff}.ib.on{background:var(--t)}
.chip{padding:3px 10px;font-size:13px;border-radius:20px;box-shadow:0 3px 0 var(--ink);margin:2px}.chip.sel,.cat.sel{background:var(--y)}.chip.me{background:#e6dcff}.chip.q{background:#e8fbf8}
button:disabled{opacity:1;cursor:default}
.inp{flex:1;min-width:0;border:3px solid var(--ink);border-radius:14px;padding:7px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.row{display:flex;gap:7px;align-items:center;margin:6px 0}.row.wrap{flex-wrap:wrap}
.hd{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--v);border-bottom:4px solid var(--ink);color:#fff}
.hd .ttl{font-size:17px}.sp{flex:1}.tm{background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:1px 10px;font-size:17px}.tm.low{background:var(--r);color:#fff;animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.12)}}
.home{margin:auto;display:flex;gap:18px;align-items:center;padding:10px;max-height:100%;overflow:auto}
.logo{text-align:center}.logo .big{font-size:64px}.logo h1{margin:0;font-size:34px;color:var(--v);text-shadow:3px 3px 0 var(--y)}.logo p{margin:4px 0}
.panel,.card{background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:12px;min-width:290px}
.rl{min-height:6px}
.main{flex:1;display:flex;min-height:0}.mid{flex:1;overflow:auto;padding:8px;min-width:0}
.side{width:250px;display:flex;flex-direction:column;border-right:4px solid var(--ink);background:#fff8e6;padding:6px}
.noside .side{display:none}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:3px;font-size:13px;box-shadow:0 2px 0 var(--ink)}.tabs .sel{background:var(--y)}
.msgs{flex:1;overflow:auto;padding:4px;font-size:13px}.m{margin:3px 0;padding:3px 8px;border-radius:10px;background:#fff;border:2px solid var(--ink);word-break:break-word}.m.me{background:#d7f7f3}.m.s{background:transparent;border:0;color:#7a6c99;font-size:12px}.m.win{color:#0a8f4e}.m.bad,.m.miss{color:var(--r)}
.emos{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.emos button{padding:1px 5px;font-size:17px;box-shadow:0 2px 0 var(--ink);border-radius:10px}
.lob{display:flex;gap:10px;flex-wrap:wrap}.lob .card{flex:1;min-width:260px}.lob h3{margin:2px 0 6px;font-size:15px}.code{background:var(--y);border:3px solid var(--ink);border-radius:10px;padding:0 8px;letter-spacing:2px}
.cats{display:flex;flex-wrap:wrap;gap:6px}.cat{display:flex;align-items:center;gap:5px;padding:4px 10px;font-size:14px}.cat span{font-size:20px}.cat small{color:#7a6c99}
.sb{display:flex;flex-wrap:wrap}.mut{color:#7a6c99}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pc{width:112px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);overflow:hidden;text-align:center}
.pc.turn{background:var(--y);animation:bob .8s infinite alternate}.pc.me{border-color:var(--v)}.pc.done{opacity:.8}
@keyframes bob{to{transform:translateY(-4px)}}
.pc .img{height:96px;background:#ffe9f1;position:relative;display:flex;align-items:center;justify-content:center}.pc img{width:100%;height:100%;object-fit:cover;object-position:top}
.qm{font-size:46px}.rk{position:absolute;top:3px;left:3px;background:var(--t);border:2px solid var(--ink);border-radius:9px;padding:0 6px;font-size:13px}.rk.bad{background:var(--r);color:#fff}
.cn{font-size:13px;padding:2px 3px;line-height:1.2;min-height:30px;display:flex;align-items:center;justify-content:center}.who{font-size:11px;padding:2px;background:#f2e9ff;border-top:2px solid var(--ink)}.who i{color:#0a8f4e}
.tick{margin:6px auto;max-width:600px;text-align:center;background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:2px 8px;font-size:13px;min-height:24px}
.act{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 10px;margin:4px auto;max-width:680px;box-shadow:0 4px 0 var(--ink)}.act p{margin:4px 0}.act.mine{background:#effbf9}.act .row{margin:4px 0}
.hints{font-size:12px;color:var(--v)}
.brk{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:8px 14px;margin:8px auto;max-width:560px;text-align:center}.brk h2{margin:2px}
.res{text-align:center}.res h2{margin:2px}
.modal{position:fixed;inset:0;background:#2b214099;z-index:50;display:flex;align-items:center;justify-content:center}
.modal .box{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:12px 16px;max-width:620px;max-height:92%;overflow:auto;width:94%}.rule b{color:var(--v)}.rule p{margin:2px 0 8px}
.emo{position:fixed;bottom:60px;z-index:60;text-align:center;animation:fl 2.5s ease-out forwards;pointer-events:none}.emo div{font-size:44px}.emo small{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;font-size:11px}
@keyframes fl{to{transform:translateY(-260px) rotate(12deg);opacity:0}}
#toast{position:fixed;top:48px;left:10px;right:10px;z-index:99;background:var(--r);color:#fff;border:3px solid var(--ink);padding:7px 14px;border-radius:14px;text-align:center;display:none}
@media (max-height:460px){.pc{width:88px}.pc .img{height:58px}.tick{margin:3px auto;font-size:12px}.pc .who{font-size:10px}.hd{padding:3px 8px}.cn{font-size:12px;min-height:26px}.logo .big{font-size:40px}.logo h1{font-size:26px}.panel,.card{padding:8px}.side{width:190px}.msgs{font-size:12px}.cards{gap:6px}.act{padding:2px 8px}.act .row{margin:3px 0}}
@media (max-width:600px) and (orientation:portrait){.main{flex-direction:column}.side{width:auto;height:35%;border-right:0;border-top:4px solid var(--ink)}.home{flex-direction:column}}
</style></head><body><div id="app"></div><div id="toast"></div><script src="/game.js"></script></body></html>

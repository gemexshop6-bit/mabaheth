<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اعرف مين المعايا؟</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#FFF4D6;--ink:#2b2140;--y:#FFC93C;--p:#FF6B9D;--t:#2EC4B6;--v:#7B5CFF;--r:#FF5A5F;--card:#fff;--w:#fff;--s1:#fff8e6;--s2:#ffe9f1;--s3:#f2e9ff;--s4:#e6dcff;--s5:#e8fbf8;--s6:#effbf9;--s7:#d7f7f3;--dot:#ffe29a;--mut:#7a6c99;--onY:#2b2140;--hd:#7B5CFF;--line:#2b2140}
[data-theme=dark]{--bg:#1b1630;--ink:#f3eeff;--card:#2a2347;--w:#2a2347;--s1:#231d3d;--s2:#3a2a4d;--s3:#352d55;--s4:#443a75;--s5:#1f3a40;--s6:#1f3a40;--s7:#1f4a4a;--dot:#2a2347;--mut:#a99ccf;--onY:#2b2140;--hd:#4a3aa8;--v:#b3a1ff;--line:#0d0a1c}
[data-theme=dark] .btn.y,[data-theme=dark] .btn.t,[data-theme=dark] .chip.sel,[data-theme=dark] .cat.sel,[data-theme=dark] .tabs .sel,[data-theme=dark] .pc.turn,[data-theme=dark] .tm,[data-theme=dark] .code,[data-theme=dark] .btn.p{color:#2b2140}
[data-theme=dark] .btn.r,[data-theme=dark] .ib.rd{color:#fff}
[data-theme=dark] .pc.turn .who,[data-theme=dark] .pc.turn .cn{color:#2b2140}
[data-theme=dark] .pc.turn{background:var(--y)}
*{box-sizing:border-box}html,body{margin:0;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:700;overflow:hidden}
body{background-image:radial-gradient(var(--dot) 2px,transparent 2px);background-size:22px 22px}
#app{height:100%;display:flex;flex-direction:column}
button{font-family:inherit;font-weight:900;color:var(--ink);cursor:pointer}
.btn,.ib,.chip,.cat,.tabs button,.emos button{border:3px solid var(--line);border-radius:14px;background:var(--w);box-shadow:0 4px 0 var(--line);padding:7px 14px;font-size:15px;transition:transform .08s}
.btn:active,.ib:active,.chip:active,.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.y{background:var(--y)}.btn.t{background:var(--t)}.btn.p{background:var(--p)}.btn.r{background:var(--r);color:#fff}.btn.sm{padding:6px 10px;font-size:14px}.big2{width:100%;margin-top:10px;font-size:20px;padding:10px}
.ib{padding:3px 9px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--line)}.ib.rd{background:var(--r);color:#fff}.ib.on{background:var(--t)}
.chip{padding:3px 10px;font-size:13px;border-radius:20px;box-shadow:0 3px 0 var(--line);margin:2px}.chip.sel,.cat.sel{background:var(--y)}.chip.me{background:var(--s4)}.chip.q{background:var(--s5)}
button:disabled{opacity:1;cursor:default}
.inp{flex:1;min-width:0;border:3px solid var(--line);border-radius:14px;padding:7px 12px;font:inherit;font-size:15px;background:var(--w);color:var(--ink)}
.row{display:flex;gap:7px;align-items:center;margin:6px 0}.row.wrap{flex-wrap:wrap}
.hd{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--hd);border-bottom:4px solid var(--line);color:#fff}
.hd .ttl{font-size:17px}.sp{flex:1}.tm{background:var(--y);color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:1px 10px;font-size:17px}.tm.low{background:var(--r);color:#fff;animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.12)}}
.home{margin:auto;display:flex;gap:18px;align-items:center;padding:10px;max-height:100%;overflow:auto}
.logo{text-align:center}.logo .big{font-size:64px}.logo h1{margin:0;font-size:34px;color:var(--v);text-shadow:3px 3px 0 var(--y)}.logo p{margin:4px 0}
.panel,.card{background:var(--card);border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:12px;min-width:290px}
.rl{min-height:6px}
.main{flex:1;display:flex;min-height:0}.mid{flex:1;overflow:auto;padding:8px;min-width:0}
.side{width:250px;display:flex;flex-direction:column;border-right:4px solid var(--line);background:var(--w)8e6;padding:6px}
.noside .side{display:none}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:3px;font-size:13px;box-shadow:0 2px 0 var(--line)}.tabs .sel{background:var(--y)}
.msgs{flex:1;overflow:auto;padding:4px;font-size:13px}.m{margin:3px 0;padding:3px 8px;border-radius:10px;background:var(--w);border:2px solid var(--line);word-break:break-word}.m.me{background:var(--s7)}.m.s{background:transparent;border:0;color:var(--mut);font-size:12px}.m.win{color:#0a8f4e}.m.bad,.m.miss{color:var(--r)}
.emos{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.emos button{padding:1px 5px;font-size:17px;box-shadow:0 2px 0 var(--line);border-radius:10px}
.lob{display:flex;gap:10px;flex-wrap:wrap}.lob .card{flex:1;min-width:260px}.lob h3{margin:2px 0 6px;font-size:15px}.code{background:var(--y);border:3px solid var(--line);border-radius:10px;padding:0 8px;letter-spacing:2px}
.cats{display:flex;flex-wrap:wrap;gap:6px}.cat{display:flex;align-items:center;gap:5px;padding:4px 10px;font-size:14px}.cat span{font-size:20px}.cat small{color:var(--mut)}
.sb{display:flex;flex-wrap:wrap}.mut{color:var(--mut)}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pc{width:112px;background:var(--w);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);overflow:hidden;text-align:center}
.pc.turn{background:var(--y);animation:bob .8s infinite alternate}.pc.me{border-color:var(--v)}.pc.done{opacity:.8}
@keyframes bob{to{transform:translateY(-4px)}}
.pc .img{height:96px;background:var(--s2);position:relative;display:flex;align-items:center;justify-content:center}.pc img{width:100%;height:100%;object-fit:cover;object-position:top}
.qm{font-size:46px}.rk{position:absolute;top:3px;left:3px;background:var(--t);border:2px solid var(--line);border-radius:9px;padding:0 6px;font-size:13px}.rk.bad{background:var(--r);color:#fff}
.cn{font-size:13px;padding:2px 3px;line-height:1.2;min-height:30px;display:flex;align-items:center;justify-content:center}.who{font-size:11px;padding:2px;background:var(--s3);border-top:2px solid var(--line)}.who i{color:#0a8f4e}
.tick{margin:6px auto;max-width:600px;text-align:center;background:var(--w);border:3px dashed var(--line);border-radius:12px;padding:2px 8px;font-size:13px;min-height:24px}
.act{background:var(--w);border:3px solid var(--line);border-radius:16px;padding:4px 10px;margin:4px auto;max-width:680px;box-shadow:0 4px 0 var(--line)}.act p{margin:4px 0}.act.mine{background:var(--s6)}.act .row{margin:4px 0}
.hints{font-size:12px;color:var(--v)}
.brk{background:var(--w);border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:8px 14px;margin:8px auto;max-width:560px;text-align:center}.brk h2{margin:2px}
.res{text-align:center}.res h2{margin:2px}
.modal{position:fixed;inset:0;background:#2b214099;z-index:50;display:flex;align-items:center;justify-content:center}
.modal .box{background:var(--w);border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:12px 16px;max-width:620px;max-height:92%;overflow:auto;width:94%}.rule b{color:var(--v)}.rule p{margin:2px 0 8px}
.emo{position:fixed;bottom:60px;z-index:60;text-align:center;animation:fl 2.5s ease-out forwards;pointer-events:none}.emo div{font-size:44px}.emo small{background:var(--w);border:2px solid var(--line);border-radius:8px;padding:0 5px;font-size:11px}
@keyframes fl{to{transform:translateY(-260px) rotate(12deg);opacity:0}}
#toast{position:fixed;top:48px;left:10px;right:10px;z-index:99;background:var(--r);color:#fff;border:3px solid var(--line);padding:7px 14px;border-radius:14px;text-align:center;display:none}
@media (max-height:460px){.act.mine .row{flex-wrap:nowrap}.act.mine .row.cr{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;padding-bottom:3px}.chip.q{flex:none}.act .inp{padding:3px 8px;font-size:13px}.act .btn.sm{padding:3px 8px;font-size:13px;flex:none}.mid{padding:4px}.brk{padding:4px 10px;margin:2px auto}.brk p{margin:2px}.brk h2{font-size:18px}.res h2{font-size:18px;margin:0}.lob h3{margin:0 0 3px}.tm{font-size:15px}.pc{width:88px}.pc .img{height:58px}.tick{margin:3px auto;font-size:12px}.pc .who{font-size:10px}.hd{padding:3px 8px}.cn{font-size:12px;min-height:26px}.logo .big{font-size:40px}.logo h1{font-size:26px}.panel,.card{padding:8px}.side{width:190px}.msgs{font-size:12px}.cards{gap:6px}.act{padding:2px 8px}.act .row{margin:3px 0}}
@media (max-width:600px) and (orientation:portrait){.main{flex-direction:column}.side{width:auto;height:35%;border-right:0;border-top:4px solid var(--line)}.home{flex-direction:column}}
@media (max-height:400px){.pc{width:78px}.pc .img{height:42px}.cn{min-height:20px;font-size:11px}.tick{display:none}.act{margin:2px auto}.act .row{margin:2px 0}.qm{font-size:30px}.hd .ttl{font-size:14px}.ib{font-size:12px;padding:2px 6px}}
</style></head><body><div id="app"></div><div id="toast"></div><script>try{document.documentElement.dataset.theme=localStorage.mbTheme||'light'}catch(e){}</script><script src="/game.js"></script></body></html>
